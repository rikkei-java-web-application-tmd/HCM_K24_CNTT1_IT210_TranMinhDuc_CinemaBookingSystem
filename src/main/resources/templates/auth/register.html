<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <link rel="stylesheet" th:href="@{/css/basic.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
<h1>Đăng ký khách hàng</h1>

<form th:action="@{/register}" th:object="${registerRequest}" method="post" class="panel form-box">
    <div th:if="${#fields.hasGlobalErrors()}">
        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="status-bad">Lỗi đăng ký</p>
    </div>

    <p>
        <label for="username">Tên đăng nhập</label><br>
        <input id="username" type="text" th:field="*{username}">
        <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="status-bad"></span>
    </p>

    <p>
        <label for="password">Mật khẩu</label><br>
        <input id="password" type="password" th:field="*{password}">
        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="status-bad"></span>
    </p>

    <p>
        <label for="fullName">Họ tên</label><br>
        <input id="fullName" type="text" th:field="*{fullName}">
        <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="status-bad"></span>
    </p>

    <p>
        <label for="phone">Số điện thoại</label><br>
        <input id="phone" type="tel" th:field="*{phone}">
        <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="status-bad"></span>
    </p>

    <p>
        <label for="email">Email</label><br>
        <input id="email" type="email" th:field="*{email}">
        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="status-bad"></span>
    </p>

    <button type="submit">Tạo tài khoản</button>
    <a th:href="@{/login}">Đã có tài khoản</a>
</form>
</main>
</body>
</html>
