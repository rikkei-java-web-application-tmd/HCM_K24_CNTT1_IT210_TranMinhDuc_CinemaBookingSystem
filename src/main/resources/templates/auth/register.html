<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>

<main class="container pb-5" style="max-width: 680px;">
    <h1 class="h3 fw-bold mb-4">Đăng ký khách hàng</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/register}" th:object="${registerRequest}" method="post" novalidate>
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Lỗi đăng ký</div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold" for="username">Tên đăng nhập</label>
                        <input id="username" type="text" class="form-control"
                               th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                               th:field="*{username}">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">
                            Tên đăng nhập không hợp lệ
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold" for="password">Mật khẩu</label>
                        <input id="password" type="password" class="form-control"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                               th:field="*{password}">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                            Mật khẩu không hợp lệ
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold" for="fullName">Họ tên</label>
                        <input id="fullName" type="text" class="form-control"
                               th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                               th:field="*{fullName}">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">
                            Họ tên không hợp lệ
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold" for="phone">Số điện thoại</label>
                        <input id="phone" type="tel" class="form-control"
                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                               th:field="*{phone}">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">
                            Số điện thoại không hợp lệ
                        </div>
                    </div>
                    <div class="col-12 mb-4">
                        <label class="form-label fw-semibold" for="email">Email</label>
                        <input id="email" type="email" class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                               th:field="*{email}">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                            Email không hợp lệ
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-success fw-semibold">Tạo tài khoản</button>
                <a th:href="@{/login}" class="btn btn-link">Đã có tài khoản</a>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
