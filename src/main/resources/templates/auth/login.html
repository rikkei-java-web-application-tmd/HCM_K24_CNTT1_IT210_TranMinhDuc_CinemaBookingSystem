<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <link rel="stylesheet" th:href="@{/css/basic.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
<h1>Đăng nhập</h1>

<p th:if="${successMessage}" th:text="${successMessage}" class="message"></p>
<p th:if="${param.logout}" class="message">Bạn đã đăng xuất.</p>

<form th:action="@{/login}" th:object="${loginRequest}" method="post" class="panel form-box">
    <div th:if="${#fields.hasGlobalErrors()}">
        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="status-bad">Lỗi đăng nhập</p>
    </div>

    <p>
        <label for="username">Tên đăng nhập</label><br>
        <input id="username" type="text" th:field="*{username}" autofocus>
        <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="status-bad"></span>
    </p>

    <p>
        <label for="password">Mật khẩu</label><br>
        <input id="password" type="password" th:field="*{password}">
        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="status-bad"></span>
    </p>

    <button type="submit">Đăng nhập</button>
    <a th:href="@{/register}">Tạo tài khoản khách hàng</a>
</form>
</main>
</body>
</html>
