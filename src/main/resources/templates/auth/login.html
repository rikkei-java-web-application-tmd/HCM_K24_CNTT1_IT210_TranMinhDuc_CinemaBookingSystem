<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>

<main class="container pb-5" style="max-width: 520px;">
    <h1 class="h3 fw-bold mb-4">Đăng nhập</h1>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${param.logout}" class="alert alert-success">Bạn đã đăng xuất.</div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/login}" th:object="${loginRequest}" method="post" novalidate>
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Lỗi đăng nhập</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="username">Tên đăng nhập</label>
                    <input id="username" type="text" class="form-control"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                           th:field="*{username}" autofocus>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">
                        Tên đăng nhập không hợp lệ
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold" for="password">Mật khẩu</label>
                    <input id="password" type="password" class="form-control"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                           th:field="*{password}">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                        Mật khẩu không hợp lệ
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-semibold">Đăng nhập</button>
            </form>
        </div>
    </div>

    <p class="text-center mt-3 mb-0">
        <a th:href="@{/register}">Tạo tài khoản khách hàng</a>
    </p>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
