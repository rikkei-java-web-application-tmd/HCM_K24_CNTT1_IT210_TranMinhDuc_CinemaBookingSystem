<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Cinema - Lịch chiếu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>

<main class="container pb-5">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="d-flex justify-content-between align-items-end border-bottom pb-3 mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1">Lịch chiếu hôm nay và sắp tới</h1>
            <p class="text-muted mb-0">Các suất đã bắt đầu được ẩn tự động theo thời gian hiện tại.</p>
        </div>
    </div>

    <div class="row g-4" th:if="${!#lists.isEmpty(showtimes)}">
        <div class="col-sm-6 col-lg-4 col-xl-3" th:each="showtime : ${showtimes}">
            <article class="card h-100 shadow-sm">
                <img th:src="${showtime.posterUrl}" class="card-img-top" alt="Poster"
                     style="height: 320px; object-fit: cover;">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between gap-2 mb-2">
                        <h2 class="h5 fw-bold mb-0" th:text="${showtime.movieTitle}">Tên phim</h2>
                        <span class="badge align-self-start"
                              th:classappend="${showtime.soldOut} ? 'text-bg-danger' : 'text-bg-success'"
                              th:text="${showtime.soldOut} ? 'Hết vé' : 'Còn vé'">Còn vé</span>
                    </div>
                    <p class="small text-muted mb-3">
                        <span th:text="${showtime.roomName}">Phòng</span><br>
                        <span th:text="${#temporals.format(showtime.startTime, 'dd/MM/yyyy HH:mm')}">Giờ</span><br>
                        <span th:text="${showtime.duration} + ' phút'">120 phút</span>
                    </p>
                    <div class="mt-auto">
                        <div class="small text-muted mb-2">
                            <span th:text="${showtime.soldSeats}">0</span>/<span th:text="${showtime.totalSeats}">0</span> ghế đã bán
                        </div>
                        <a class="btn w-100 fw-semibold"
                           th:classappend="${showtime.soldOut} ? 'btn-outline-danger' : 'btn-danger'"
                           th:href="@{/showtimes/{id}/seats(id=${showtime.id})}">
                            Xem sơ đồ ghế
                        </a>
                    </div>
                </div>
            </article>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(showtimes)}" class="alert alert-warning text-center">
        Chưa có suất chiếu còn hiệu lực.
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
