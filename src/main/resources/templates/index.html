<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ - Lịch chiếu</title>
    <link rel="stylesheet" th:href="@{/css/basic.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
<h1>Trang chủ - Lịch chiếu</h1>

<p th:if="${successMessage}" th:text="${successMessage}" class="message"></p>
<p th:if="${errorMessage}" th:text="${errorMessage}" class="message error"></p>

<p>Các suất chiếu còn hiệu lực.</p>

<table th:if="${!#lists.isEmpty(showtimes)}">
    <thead>
    <tr>
        <th>Phim</th>
        <th>Ảnh</th>
        <th>Mô tả</th>
        <th>Phòng</th>
        <th>Giờ chiếu</th>
        <th>Thời lượng</th>
        <th>Ghế đã bán</th>
        <th>Trạng thái</th>
        <th>Thao tác</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="showtime : ${showtimes}">
        <td th:text="${showtime.movieTitle}">Tên phim</td>
        <td>
            <img th:if="${showtime.posterUrl != null && !#strings.isEmpty(showtime.posterUrl)}"
                 th:src="${showtime.posterUrl}" alt="Poster" class="poster-small">
            <span th:if="${showtime.posterUrl == null || #strings.isEmpty(showtime.posterUrl)}">Không có ảnh</span>
        </td>
        <td th:text="${showtime.description}">Mô tả</td>
        <td th:text="${showtime.roomName}">Phòng</td>
        <td th:text="${#temporals.format(showtime.startTime, 'dd/MM/yyyy HH:mm')}">Giờ</td>
        <td th:text="${showtime.duration} + ' phút'">120 phút</td>
        <td>
            <span th:text="${showtime.soldSeats}">0</span>/<span th:text="${showtime.totalSeats}">0</span>
        </td>
        <td th:text="${showtime.soldOut} ? 'Hết vé' : 'Còn vé'">Còn vé</td>
        <td>
            <a class="button" th:href="@{/showtimes/{id}/seats(id=${showtime.id})}">Xem ghế / Đặt vé</a>
        </td>
    </tr>
    </tbody>
</table>

<p th:if="${#lists.isEmpty(showtimes)}">Chưa có suất chiếu còn hiệu lực.</p>
</main>
</body>
</html>
