<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lịch sử vé</title>
    <link rel="stylesheet" th:href="@{/css/basic.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
<h1>Lịch sử vé</h1>

<p th:if="${successMessage}" th:text="${successMessage}" class="message"></p>
<p th:if="${errorMessage}" th:text="${errorMessage}" class="message error"></p>

<p th:if="${#lists.isEmpty(bookings)}">Bạn chưa có hóa đơn đặt vé.</p>

<table th:if="${!#lists.isEmpty(bookings)}">
    <thead>
    <tr>
        <th>Mã hóa đơn</th>
        <th>Ngày đặt</th>
        <th>Phim</th>
        <th>Suất chiếu</th>
        <th>Phòng</th>
        <th>Ghế</th>
        <th>Tổng tiền</th>
        <th>Trạng thái</th>
        <th>Thao tác</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="booking : ${bookings}">
        <td th:text="${booking.bookingId}">1</td>
        <td th:text="${#temporals.format(booking.bookingDate, 'dd/MM/yyyy HH:mm')}">Ngày đặt</td>
        <td th:text="${booking.movieTitle}">Tên phim</td>
        <td th:text="${#temporals.format(booking.startTime, 'dd/MM/yyyy HH:mm')}">Giờ chiếu</td>
        <td th:text="${booking.roomName}">Phòng</td>
        <td th:text="${booking.seatLabel}">A1</td>
        <td>
            <span th:text="${#numbers.formatDecimal(booking.totalAmount, 0, 'COMMA', 0, 'POINT')}">0</span> VND
        </td>
        <td th:text="${booking.status == 'PAID'} ? 'Đã thanh toán' : 'Đã hủy'">Trạng thái</td>
        <td>
            <form th:if="${booking.cancellable}" th:action="@{/bookings/{id}/cancel(id=${booking.bookingId})}" method="post"
                  onsubmit="return confirm('Bạn có chắc chắn muốn hủy hóa đơn này?');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">Hủy vé</button>
            </form>
            <span th:if="${!booking.cancellable}">Không thể hủy</span>
        </td>
    </tr>
    </tbody>
</table>
</main>
</body>
</html>
