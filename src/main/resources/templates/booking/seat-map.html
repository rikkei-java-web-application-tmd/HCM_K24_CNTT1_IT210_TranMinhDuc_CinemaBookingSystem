<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sơ đồ ghế</title>
    <link rel="stylesheet" th:href="@{/css/basic.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
<h1 th:text="${seatMap.movieTitle}">Tên phim</h1>
<p>
    Phòng: <span th:text="${seatMap.roomName}">Phòng</span><br>
    Giờ chiếu: <span th:text="${#temporals.format(seatMap.startTime, 'dd/MM/yyyy HH:mm')}">Giờ chiếu</span><br>
    Ghế đã bán: <span th:text="${seatMap.soldSeats}">0</span>/<span th:text="${seatMap.totalSeats}">0</span><br>
    Trạng thái: <span th:text="${seatMap.soldOut} ? 'Hết vé' : 'Còn vé'">Còn vé</span>
</p>

<p th:if="${successMessage}" th:text="${successMessage}" class="message"></p>
<p th:if="${errorMessage}" th:text="${errorMessage}" class="message error"></p>

<form th:action="@{/bookings}" method="post" class="panel">
    <input type="hidden" name="showtimeId" th:value="${seatMap.showtimeId}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <table>
        <thead>
        <tr>
            <th>Chọn</th>
            <th>Ghế</th>
            <th>Trạng thái</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="seat : ${seatMap.seats}">
            <td>
                <input type="checkbox" name="seatIds" th:value="${seat.seatId}" th:disabled="${seat.sold}">
            </td>
            <td th:text="${seat.seatName}">A1</td>
            <td th:text="${seat.sold} ? 'Đã bán' : 'Còn trống'">Còn trống</td>
        </tr>
        </tbody>
    </table>

    <p>
        <button th:if="${isCustomer && !seatMap.soldOut}" type="submit">Thanh toán</button>
        <a th:if="${!isAuthenticated}" th:href="@{/login}">Đăng nhập để đặt vé</a>
        <span th:if="${isAuthenticated && !isCustomer}">Tài khoản này không phải khách hàng nên không đặt vé.</span>
        <a th:href="@{/}">Quay lại</a>
    </p>
</form>
</main>
</body>
</html>
