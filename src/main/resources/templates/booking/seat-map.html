<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sơ đồ ghế</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .seat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
            gap: 10px;
        }
        .seat-box {
            min-height: 48px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            cursor: pointer;
            background: #fff;
            transition: border-color .15s ease, background .15s ease;
        }
        .seat-box input {
            position: absolute;
            opacity: 0;
        }
        .seat-box:has(input:checked) {
            background: #198754;
            border-color: #198754;
            color: #fff;
        }
        .seat-box.sold {
            background: #dc3545;
            border-color: #dc3545;
            color: #fff;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>

<main class="container pb-5">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1" th:text="${seatMap.movieTitle}">Tên phim</h1>
            <div class="text-muted">
                <span th:text="${seatMap.roomName}">Phòng</span> -
                <span th:text="${#temporals.format(seatMap.startTime, 'dd/MM/yyyy HH:mm')}">Giờ chiếu</span>
            </div>
        </div>
        <span class="badge fs-6"
              th:classappend="${seatMap.soldOut} ? 'text-bg-danger' : 'text-bg-success'"
              th:text="${seatMap.soldOut} ? 'Hết vé' : 'Còn vé'">Còn vé</span>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="d-flex gap-3 flex-wrap mb-4 small">
                <span><span class="badge text-bg-light border">A1</span> Còn trống</span>
                <span><span class="badge text-bg-success">A1</span> Đang chọn</span>
                <span><span class="badge text-bg-danger">A1</span> Đã bán</span>
                <span class="ms-md-auto">
                    <span th:text="${seatMap.soldSeats}">0</span>/<span th:text="${seatMap.totalSeats}">0</span> ghế đã bán
                </span>
            </div>

            <form th:action="@{/bookings}" method="post">
                <input type="hidden" name="showtimeId" th:value="${seatMap.showtimeId}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="seat-grid mb-4">
                    <label th:each="seat : ${seatMap.seats}"
                           class="seat-box"
                           th:classappend="${seat.sold} ? ' sold' : ''">
                        <input type="checkbox" name="seatIds" th:value="${seat.seatId}" th:disabled="${seat.sold}">
                        <span th:text="${seat.seatName}">A1</span>
                    </label>
                </div>

                <button th:if="${isCustomer && !seatMap.soldOut}" type="submit" class="btn btn-danger fw-semibold">
                    Thanh toán
                </button>
                <a th:if="${!isAuthenticated}" th:href="@{/login}" class="btn btn-primary fw-semibold">Đăng nhập để đặt vé</a>
                <a th:href="@{/}" class="btn btn-secondary fw-semibold">Quay lại</a>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
