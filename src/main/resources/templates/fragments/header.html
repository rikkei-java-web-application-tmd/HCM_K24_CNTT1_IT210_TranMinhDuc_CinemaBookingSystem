<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header">
    <nav class="top-nav">
        <a class="brand" th:href="@{/}">Smart Cinema</a>
        <a th:href="@{/}">Trang chủ</a>
        <span th:if="${isAdmin}">
            <a th:href="@{/admin/movies}">Quản lý phim</a>
            <a th:href="@{/admin/showtimes}">Quản lý suất chiếu</a>
        </span>
        <span th:if="${isCustomer}">
            <a th:href="@{/history}">Lịch sử vé</a>
        </span>
        <span th:if="${isAuthenticated}">
            <a th:href="@{/profile}" th:text="${currentUser.username}">Tài khoản</a>
            <form th:action="@{/logout}" method="post" class="inline-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">Đăng xuất</button>
            </form>
        </span>
        <span th:if="${!isAuthenticated}">
            <a th:href="@{/login}">Đăng nhập</a>
            <a th:href="@{/register}">Đăng ký</a>
        </span>
    </nav>
</header>
</body>
</html>
