<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">Smart Cinema</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">Lịch chiếu</a>
                    </li>
                    <li class="nav-item" th:if="${isAdmin}">
                        <a class="nav-link text-warning fw-semibold" th:href="@{/admin/movies}">Quản lý phim</a>
                    </li>
                    <li class="nav-item" th:if="${isAdmin}">
                        <a class="nav-link text-warning fw-semibold" th:href="@{/admin/showtimes}">Suất chiếu</a>
                    </li>
                    <li class="nav-item" th:if="${isCustomer}">
                        <a class="nav-link" th:href="@{/bookings/history}">Vé của tôi</a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item" th:if="${isAuthenticated}">
                        <a class="nav-link" th:href="@{/profile}" th:text="${currentUser.username}">profile</a>
                    </li>
                    <li class="nav-item" th:if="${isAuthenticated}">
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-outline-light btn-sm">Đăng xuất</button>
                        </form>
                    </li>
                    <li class="nav-item" th:if="${!isAuthenticated}">
                        <a class="nav-link" th:href="@{/register}">Đăng ký</a>
                    </li>
                    <li class="nav-item" th:if="${!isAuthenticated}">
                        <a class="btn btn-primary btn-sm px-3" th:href="@{/login}">Đăng nhập</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
</body>
</html>
