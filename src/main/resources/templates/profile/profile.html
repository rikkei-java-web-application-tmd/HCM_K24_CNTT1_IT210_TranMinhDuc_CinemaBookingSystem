<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hồ sơ cá nhân</title>
    <link rel="stylesheet" th:href="@{/css/basic.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
<h1>Hồ sơ cá nhân</h1>

<p th:if="${successMessage}" th:text="${successMessage}" class="message"></p>
<p th:if="${errorMessage}" th:text="${errorMessage}" class="message error"></p>

<form th:action="@{/profile}" th:object="${profile}" method="post" class="panel form-box">
    <input type="hidden" th:field="*{id}">

    <p>
        <label>Tên đăng nhập</label><br>
        <input type="text" th:field="*{username}" readonly>
    </p>

    <p>
        <label>Vai trò</label><br>
        <input type="text" th:field="*{role}" readonly>
    </p>

    <p>
        <label>Họ tên</label><br>
        <input type="text" th:field="*{fullName}">
    </p>

    <p>
        <label>Số điện thoại</label><br>
        <input type="tel" th:field="*{phone}">
    </p>

    <p>
        <label>Email</label><br>
        <input type="email" th:field="*{email}">
    </p>

    <button type="submit">Lưu hồ sơ</button>
</form>
</main>
</body>
</html>
