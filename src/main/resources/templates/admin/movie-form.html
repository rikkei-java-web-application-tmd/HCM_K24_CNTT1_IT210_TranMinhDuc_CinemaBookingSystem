<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form phim</title>
    <link rel="stylesheet" th:href="@{/css/basic.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
<h1 th:text="${movie.id == null ? 'Thêm phim' : 'Cập nhật phim'}">Form phim</h1>

<form th:action="@{/admin/movies/save}" th:object="${movie}" method="post" class="panel form-box">
    <input type="hidden" th:field="*{id}">

    <p>
        <label>Tên phim</label><br>
        <input type="text" th:field="*{title}" required>
    </p>

    <p>
        <label>Đạo diễn</label><br>
        <input type="text" th:field="*{director}" required>
    </p>

    <p>
        <label>Thời lượng (phút)</label><br>
        <input type="number" min="1" th:field="*{duration}" required>
    </p>

    <p>
        <label>Trạng thái</label><br>
        <select th:field="*{status}">
            <option value="ACTIVE">Đang chiếu</option>
            <option value="INACTIVE">Ngừng chiếu</option>
        </select>
    </p>

    <p>
        <label>Poster URL</label><br>
        <input type="text" th:field="*{posterUrl}" placeholder="https://...jpg hoặc /images/poster.jpg">
    </p>

    <p>
        <label>Mô tả</label><br>
        <textarea th:field="*{description}" rows="4"></textarea>
    </p>

    <p>
        <label>Thể loại</label><br>
        <select th:field="*{genreIds}" multiple size="5">
            <option th:each="genre : ${allGenres}"
                    th:value="${genre.id}"
                    th:text="${genre.name}">Thể loại</option>
        </select>
    </p>

    <button type="submit">Lưu</button>
    <a th:href="@{/admin/movies}">Hủy</a>
</form>
</main>
</body>
</html>
