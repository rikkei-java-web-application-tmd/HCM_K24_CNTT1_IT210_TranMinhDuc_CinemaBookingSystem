<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xếp lịch chiếu</title>
    <link rel="stylesheet" th:href="@{/css/basic.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
<h1>Xếp lịch chiếu</h1>

<p th:if="${errorMessage}" th:text="${errorMessage}" class="message error"></p>

<form th:action="@{/admin/showtimes/save}" th:object="${showtime}" method="post" class="panel form-box">
    <p>
        <label>Phim</label><br>
        <select th:field="*{movieId}" required>
            <option value="">Chọn phim</option>
            <option th:each="movie : ${movies}"
                    th:value="${movie.id}"
                    th:text="${movie.title + ' - ' + movie.duration + ' phút'}">Phim</option>
        </select>
    </p>

    <p>
        <label>Phòng</label><br>
        <select th:field="*{roomId}" required>
            <option value="">Chọn phòng</option>
            <option th:each="room : ${rooms}"
                    th:value="${room.id}"
                    th:text="${room.name + ' (' + room.totalSeats + ' ghế)'}">Phòng</option>
        </select>
    </p>

    <p>
        <label>Giờ bắt đầu</label><br>
        <input type="datetime-local" th:field="*{startTime}" required>
    </p>

    <button type="submit">Lưu lịch chiếu</button>
    <a th:href="@{/admin/showtimes}">Hủy</a>
</form>
</main>
</body>
</html>
