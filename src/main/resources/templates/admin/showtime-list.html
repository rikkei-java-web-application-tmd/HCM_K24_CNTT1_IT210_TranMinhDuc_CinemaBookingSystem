<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý suất chiếu</title>
    <link rel="stylesheet" th:href="@{/css/basic.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
<h1>Quản lý suất chiếu</h1>
<p><a th:href="@{/admin/showtimes/create}">Xếp lịch mới</a></p>

<p th:if="${successMessage}" th:text="${successMessage}" class="message"></p>
<p th:if="${errorMessage}" th:text="${errorMessage}" class="message error"></p>

<table>
    <thead>
    <tr>
        <th>Phim</th>
        <th>Phòng</th>
        <th>Giờ bắt đầu</th>
        <th>Giờ kết thúc</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="showtime : ${showtimes}">
        <td th:text="${showtime.movieTitle}">Phim</td>
        <td th:text="${showtime.roomName}">Phòng</td>
        <td th:text="${#temporals.format(showtime.startTime, 'dd/MM/yyyy HH:mm')}">Giờ bắt đầu</td>
        <td th:text="${#temporals.format(showtime.endTime, 'dd/MM/yyyy HH:mm')}">Giờ kết thúc</td>
    </tr>
    </tbody>
</table>
</main>
</body>
</html>
