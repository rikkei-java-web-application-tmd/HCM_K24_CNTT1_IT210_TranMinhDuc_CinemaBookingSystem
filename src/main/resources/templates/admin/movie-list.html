<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý phim</title>
    <link rel="stylesheet" th:href="@{/css/basic.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
<h1>Quản lý phim</h1>
<p><a class="button" th:href="@{/admin/movies/create}">Thêm phim</a></p>

<p th:if="${successMessage}" th:text="${successMessage}" class="message"></p>
<p th:if="${errorMessage}" th:text="${errorMessage}" class="message error"></p>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Ảnh</th>
        <th>Tên phim</th>
        <th>Mô tả</th>
        <th>Thể loại</th>
        <th>Đạo diễn</th>
        <th>Thời lượng</th>
        <th>Trạng thái</th>
        <th>Thao tác</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="movie : ${movies}">
        <td th:text="${movie.id}">1</td>
        <td>
            <img th:if="${movie.posterUrl != null && !#strings.isEmpty(movie.posterUrl)}"
                 th:src="${movie.posterUrl}" alt="Poster" class="poster-small">
            <span th:if="${movie.posterUrl == null || #strings.isEmpty(movie.posterUrl)}">Không có ảnh</span>
        </td>
        <td th:text="${movie.title}">Tên phim</td>
        <td th:text="${movie.description}">Mô tả</td>
        <td th:text="${#strings.listJoin(movie.genreNames, ', ')}">Thể loại</td>
        <td th:text="${movie.director}">Đạo diễn</td>
        <td th:text="${movie.duration} + ' phút'">120 phút</td>
        <td th:text="${movie.status}">ACTIVE</td>
        <td>
            <a class="button secondary" th:href="@{/admin/movies/edit/{id}(id=${movie.id})}">Sửa</a>
            <form th:action="@{/admin/movies/delete/{id}(id=${movie.id})}" method="post" class="inline-form"
                  onsubmit="return confirm('Bạn có chắc chắn muốn xóa phim này?');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">Xóa</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</main>
</body>
</html>
