<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý phim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 fw-bold mb-0">Quản lý phim</h1>
        <a th:href="@{/admin/movies/create}" class="btn btn-success fw-semibold">Thêm phim</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Ảnh</th>
                    <th>Tên phim</th>
                    <th>Thể loại</th>
                    <th>Đạo diễn</th>
                    <th>Thời lượng</th>
                    <th>Trạng thái</th>
                    <th class="text-end">Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="movie : ${movies}">
                    <td th:text="${movie.id}"></td>
                    <td><img th:src="${movie.posterUrl}" width="52" height="72" class="rounded object-fit-cover" alt="Poster"></td>
                    <td class="fw-bold" th:text="${movie.title}"></td>
                    <td class="small text-muted" th:text="${#strings.listJoin(movie.genreNames, ', ')}"></td>
                    <td th:text="${movie.director}"></td>
                    <td th:text="${movie.duration} + ' phút'"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${movie.status == 'ACTIVE'} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${movie.status}">ACTIVE</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/admin/movies/edit/{id}(id=${movie.id})}" class="btn btn-sm btn-primary">Sửa</a>
                        <form th:action="@{/admin/movies/delete/{id}(id=${movie.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Bạn có chắc chắn muốn xóa phim này?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-sm btn-danger">Xóa</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
